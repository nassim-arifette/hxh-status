name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # A workflow GitHub cannot parse never runs, so its own CI cannot report
      # the breakage. This job is the one that still runs, so it checks the
      # others. RUNNER_TEMP is the environment variable, usable in run: unlike
      # the runner context that is rejected in a job-level env block.
      - name: Lint workflow files
        env:
          ACTIONLINT_VERSION: "1.7.12"
        run: |
          curl -sSLo "$RUNNER_TEMP/actionlint.tar.gz" \
            "https://github.com/rhysd/actionlint/releases/download/v$ACTIONLINT_VERSION/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run translations:check
      - run: npm test
      - run: npm run build

  report-automation-verification:
    # GitHub does not count workflow_dispatch job checks toward branch
    # protection. Report the actual successful verify result as a commit
    # status; this job cannot run when verification fails or is cancelled.
    needs: verify
    if: github.event_name == 'workflow_dispatch' && startsWith(github.ref_name, 'automation/verify-')
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    steps:
      - name: Report the completed verification
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST --silent \
            "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state=success \
            -f context=verify \
            -f description="All CI tests and the production build passed" \
            -f target_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
