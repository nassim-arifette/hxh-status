name: Bug report
description: Report a bug or incorrect tracker data
title: "fix: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue! Please verify that this issue has not already been reported.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of what the bug is or what data is inaccurate.
      placeholder: Describe the problem here...
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: Affected URL or Component
      description: What URL, page, or component is affected?
      placeholder: e.g. https://hxhstatus.com/ja or ChapterTracker
    validations:
      required: false
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See error
    validations:
      required: false
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Browser version, operating system, screenshots, or any other helpful context.
    validations:
      required: false
